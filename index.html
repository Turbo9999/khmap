<div id="stage"><div id="labels"></div></div>

<div class="top">

      <button class="menu" id="menu" type="button" aria-expanded="false" aria-controls="panel">選單 <span class="caret" aria-hidden="true">▾</span></button>
    </div>
    <p>點一區看賴瑞隆在當地的政見；點小人聽他說一條。資料整理自競選官網與新聞，每條附來源。</p>
  </div>
  <div class="panel" id="panel">
  <div class="tools">
    <button class="btn" id="bAll" type="button">全市</button>
    <button class="btn" id="bCore" type="button">市中心</button>
    <button class="btn" id="bList" type="button">38 區</button>
    <button class="btn" id="bCity" type="button">全市政見</button>
    <button class="btn" id="bChars" type="button">角色</button>
    <button class="btn" id="bNight" type="button" aria-pressed="false">夜晚</button>
    <button class="btn" id="bStreet" type="button">近看</button>
    <button class="btn" id="bFollow" type="button">跟小人走</button>
    <button class="btn" id="bStyle" type="button">換風格</button>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="搜尋行政區或地標，例如：蓮池潭" autocomplete="off" aria-label="搜尋行政區或地標">

  </div>

  </div>
</div>

  <button class="btn" id="zin" type="button" aria-label="放大">＋</button>
  <button class="btn" id="zout" type="button" aria-label="縮小">－</button>
  <button class="btn" id="zmode" type="button" aria-label="目前拖曳會移動地圖，點一下改成旋轉視角">移</button>
